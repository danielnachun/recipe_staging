schema_version: 1

context:
  version: 2.1

package:
  name: r-flashpcar
  version: ${{ version }}

source:
  url: https://github.com/gabraham/flashpca/archive/b8044f13607a072125828547684fde8b081d6191.zip
  sha256: d1e0dce72f8ab38150220cdc8c1fd1601174f5d8de44239d5868f2ffca385e6d

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - sed
  host:
    - r-base
    - r-abind
    - r-bh
    - r-ggplot2
    - r-rcpp
    - r-rcppeigen
    - r-rspectra
  run:
    - r-base
    - r-abind
    - r-bh
    - r-ggplot2
    - r-rcpp
    - r-rcppeigen
    - r-rspectra

tests:
  - script:
      - R -e "library('flashpcaR')"

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Fast Principal Component Analysis of Large-Scale Genome-Wide Data
  homepage: https://github.com/gabraham/flashpca
