schema_version: 1

context:
  version: "1.4.2"

package:
  name: r-smashrgen
  version: ${{ version }}

source:
  url: https://github.com/DongyueXie/smashrgen/archive/5aa77e990871e59c8b66dd6a89f56848ca920cc8.tar.gz
  sha256: 84883c428ffcb7038858e2a4ef8ce2eaf60e9ef6d792b183f0d7ea48145a2ed8

build:
  number: 0
  noarch: generic
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  host:
    - r-ashr
    - r-base
    - r-catools
    - r-ebnm
    - r-mass
    - r-mr.ashr
    - r-mvtnorm
    - r-rfast
    - r-smashr
    - r-vebpm
    - r-wavethresh
  run:
    - r-ashr
    - r-base
    - r-catools
    - r-ebnm
    - r-mass
    - r-mr.ashr
    - r-mvtnorm
    - r-rfast
    - r-smashr
    - r-vebpm
    - r-wavethresh

tests:
  - script:
      - R -e "library('smashrgen')"

about:
  license: MIT
  summary: Smooth Poisson sequence
  homepage: https://github.com/DongyueXie/smashrgen
