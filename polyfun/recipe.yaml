schema_version: 1

context:
  version: 1.0

package:
  name: polyfun
  version: ${{ version }}

source:
  url: https://github.com/omerwe/polyfun/archive/de889bde9ce3d46326fc5ea568b623450f349569.zip
  sha256: d686393960542b1f3b35652b571ed074afd8a6473ced3b955c5662eb028300bd

build:
  number: 2
  noarch: generic

requirements:
  run:
    - bgen-py
    - bitarray
    - dask
    - deprecated
    - finemap
    - networkx
    - numpy>=1.26
    - packaging
    - pandas
    - pandas-plink
    - pip
    - pyarrow>=3.0
    - python>=3.12,<3.13
    - r-ckmeans.1d.dp
    - r-expm
    - r-lattice
    - r-matrixstats
    - r-susier
    - r-stringi
    - r-wavethresh
    - rpy2>=3.5.9
    - scikit-learn
    - scipy
    - setuptools<82
    - snappy
    - tqdm
    - xarray

tests:
  - script:
      - aggregate_finemapper_results.py -h
      - compute_ldscores.py -h
      - compute_ldscores_from_ld.py -h
      - create_finemapper_jobs.py -h
      - extract_annotations.py -h
      - extract_snpvar.py -h
      - finemapper.py -h
      - ldsc.py -h
      - munge_polyfun_sumstats.py -h
      - polyfun.py -h
      - polyloc.py -h
      - polypred.py -h

about:
  license: MIT
  license_file: LICENSE
  summary: PolyFun (POLYgenic FUNctionally-informed fine-mapping)
  homepage: https://github.com/omerwe/polyfun
