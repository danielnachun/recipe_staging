schema_version: 1

context:
  version: "1.3"

package:
  name: r-peer
  version: ${{ version }}

source:
  url: https://github.com/broadinstitute/gtex-pipeline/raw/refs/heads/master/qtl/R_peer_source_1.3.tgz
  sha256: eba913c25f6d22a2ba407e42dadf4d3ce79b3c814cdfed94e6a91c18e62f5545
  patches:
    - 0001-include-cxx-headers-before-swig-extern-c.patch

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - r-base
    - r-rcppeigen
  run:
    - r-base
    - r-rcppeigen

tests:
  - script:
      - R -e "library('peer')"

about:
  license: MIT
  summary: A factor analysis package
  homepage: https://github.com/PMBio/peer
