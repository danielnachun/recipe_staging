context:
  version: 7.1.25

package:
  name: yabai
  version: ${{ version }}

source:
  url: https://github.com/ImTheSquid/yabai/archive/3b463fc436829a936095ec6a9facf2de5faab680.tar.gz
  sha256: 6a1cf091a867ca377a4d02a235b592b1c7f86598c32f0c908da33c6875c82897

build:
  number: 1
  skip: not osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - script:
      - yabai --version

about:
  license: MIT
  license_file: LICENSE.txt
  summary: A tiling window manager for macOS based on binary space partitioning
  homepage: https://github.com/koekeishiya/yabai
  repository: https://github.com/koekeishiya/yabai

extra:
  recipe-maintainers:
    - danielnachun
