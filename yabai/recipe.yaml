context:
  version: 7.1.25

package:
  name: yabai
  version: ${{ version }}

source:
  url: https://github.com/AhsanFazal/yabai/archive/ad8d5adfdc39c76399599ae79a264f2525f6ca5e.tar.gz
  sha256: 6902004ccb7d734c4473df2b95131c9894c5b07490357b45cc7ed6a99844bd99

build:
  number: 2
  skip: not osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - script:
      - yabai --version

about:
  license: MIT
  license_file: LICENSE.txt
  summary: A tiling window manager for macOS based on binary space partitioning
  homepage: https://github.com/koekeishiya/yabai
  repository: https://github.com/koekeishiya/yabai

extra:
  recipe-maintainers:
    - danielnachun
