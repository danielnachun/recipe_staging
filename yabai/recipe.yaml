context:
  version: 7.1.25

package:
  name: yabai
  version: ${{ version }}

source:
  url: https://github.com/koekeishiya/yabai/archive/v${{ version }}.tar.gz
  sha256: f60f503b24896dcb4babc034b2f85494e4be2cab6e0d41575a2f03e767403602

build:
  number: 0
  skip: not osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - script:
      - yabai --version

about:
  license: MIT
  license_file: LICENSE.txt
  summary: A tiling window manager for macOS based on binary space partitioning
  homepage: https://github.com/koekeishiya/yabai
  repository: https://github.com/koekeishiya/yabai

extra:
  recipe-maintainers:
    - danielnachun
