context:
  version: 7.1.25

package:
  name: yabai
  version: ${{ version }}

source:
  url: https://github.com/asmvik/yabai/archive/b2dc8b4c892d74738a6e865d73048ed2dc3c9ed1.tar.gz
  sha256: fbb51123c45cb32ef19d94b50f70345c84f63b2959d9165e27ba4d5d0076d2a7

build:
  number: 2
  skip: not osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - script:
      - yabai --version

about:
  license: MIT
  license_file: LICENSE.txt
  summary: A tiling window manager for macOS based on binary space partitioning
  homepage: https://github.com/koekeishiya/yabai
  repository: https://github.com/koekeishiya/yabai

extra:
  recipe-maintainers:
    - danielnachun
