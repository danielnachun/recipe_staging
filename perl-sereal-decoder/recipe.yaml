schema_version: 1

context:
  version: 5.009

package:
  name: perl-sereal-decoder
  version: ${{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/Y/YV/YVES/Sereal-Decoder-${{ version }}.tar.gz
  sha256: ac98d146ae6dfb61898046c238ba788b9bb1108ff2c3830499a09d995b5d9a49

build:
  number: 0

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - if: linux
      then: binutils
    - make
  host:
    - perl =5.32
    - perl-devel-checklib
    - perl-extutils-makemaker
    - perl-file-path
    - perl-pathtools
    - perl-scalar-list-utils
    - perl-test-deep
    - perl-test-differences
    - perl-test-longstring
    - perl-test-warn
    - perl-test-simple
  run:
    - perl =5.32
    - perl-devel-checklib
    - perl-file-path
    - perl-pathtools
    - perl-scalar-list-utils
  ignore_run_exports:
    from_package:
      - perl-test-differences
      - perl-test-deep
      - perl-test-longstring
      - perl-test-warn
      - perl-test-simple
      - perl-extutils-makemaker

tests:
  - perl:
      uses:
        - Sereal::Decoder
        - Sereal::Decoder::Constants
        - Sereal::Performance

about:
  license: Artistic-1.0-Perl
  summary: Fast, compact, powerful binary deserialization
  homepage: http://metacpan.org/pod/Sereal-Decoder
