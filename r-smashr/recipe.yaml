schema_version: 1

context:
  version: 1.3-12

package:
  name: r-smashr
  version: ${{ version|replace("-", "_") }}

source:
  url: https://cloud.r-project.org//src/contrib/smashr_${{ version }}.tar.gz
  sha256: cb5d8322853ed7d0115c40e680b5a581e8ca5f51c6e58c4751bdddafeb99bb7f

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
  host:
    - r-base
    - r-rcpp >=1.1.0
    - r-ashr
    - r-catools
    - r-data.table
    - r-wavethresh
  run:
    - r-base
    - r-rcpp >=1.1.0
    - r-ashr
    - r-catools
    - r-data.table
    - r-wavethresh

tests:
  - script:
      - R -e "library('smashr')"

about:
  license: GPL-3.0-or-later
  summary: Fast, wavelet-based Empirical Bayes shrinkage methods for signal denoising, including
    smoothing Poisson-distributed data and Gaussian-distributed data with possibly heteroskedastic
    error. The algorithms implement the methods described Z. Xing, P. Carbonetto & M.
    Stephens (2021) <https://jmlr.org/papers/v22/19-042.html>.
  homepage: https://github.com/stephenslab/smashr

