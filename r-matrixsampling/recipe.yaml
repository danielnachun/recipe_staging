context:
  version: "2.0.0"

package:
  name: r-matrixsampling
  version: ${{ version }}

source:
  url: https://cloud.r-project.org/src/contrib/matrixsampling_${{ version }}.tar.gz
  sha256: eade38bff0b162bd5dda6a8ab1cdebdac310dc54639a78240c5d1e20f3b1ab15

build:
  number: 0
  noarch: generic

requirements:
  host:
    - r-base
    - r-keep
  run:
    - r-base
    - r-keep

tests:
  - script:
      - R -e "library('matrixsampling')"

about:
  license: GPL-3.0-or-later
  summary: 'Provides samplers for various matrix variate distributions: Wishart, inverse-Wishart,
    normal, t, inverted-t, Beta type I, Beta type II, Gamma, confluent hypergeometric.
    Allows to simulate the noncentral Wishart distribution without the integer restriction
    on the degrees of freedom.'
  homepage: https://github.com/stla/matrixsampling
