context:
  version: 1.0.0
  name: PlinkMatrix
  bioc: 3.23

package:
  name: bioconductor-${{ name|lower }}
  version: ${{ version }}

source:
  url:
    - https://bioconductor.org/packages/${{ bioc }}/bioc/src/contrib/${{ name }}_${{ version }}.tar.gz
    - https://bioconductor.org/packages/${{ bioc }}/bioc/src/contrib/Archive/${{ name }}/${{ name }}_${{ version }}.tar.gz
    - https://bioarchive.galaxyproject.org/${{ name }}_${{ version }}.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-${{ name|lower }}/bioconductor-${{ name|lower }}_${{ version }}_src_all.tar.gz
  md5: 0cbf27fe5842273a2495fcc527705a80

build:
  number: 0
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/

requirements:
  host:
    - bioconductor-delayedarray
    - bioconductor-summarizedexperiment
    - bioconductor-biocfilecache
    - bioconductor-genomicranges
    - bioconductor-iranges
    - r-base=4.5
    - r-rcpp
  run:
    - bioconductor-delayedarray
    - bioconductor-summarizedexperiment
    - bioconductor-biocfilecache
    - bioconductor-genomicranges
    - bioconductor-iranges
    - r-base=4.5
    - r-rcpp
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make

tests:
  - script:
      - R -e "library('${{ name }}')"

about:
  license: MIT
  summary: DelayedArray interface for plink genotypes
  description: This package provides a DelayedArray interface for plink bed files. There is support for interfacing to plink genotype data via RangedSummarizedExperiment. Example data from the GEUVADIS project (internationalgenome.org) are used for demonstration.
  homepage: https://bioconductor.org/packages/${{ bioc }}/bioc/html/${{ name }}.html
